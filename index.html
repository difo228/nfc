function parseRoute(){
  const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase();
  const q=new URLSearchParams(location.search);
  if(h==='tags'||h==='results')return{view:h};
  let st=null,zone=null,src='nfc';
  const m=h.match(/^(?:([a-z])-?(\d{3})-)?(kassa|fuel|exit|wc)(?:-(qr|nfc))?$/);
  if(m){zone=m[3];if(m[1])st=m[1].toUpperCase()+'-'+m[2];if(m[4])src=m[4]}
  else if(q.get('zone')){zone=q.get('zone').toLowerCase();st=(q.get('azs')||'').toUpperCase()||null;src=(q.get('src')||'nfc').toLowerCase()}
  if(!zone||!ZONES.includes(zone))return{view:h?'none':'tags'};
  st=st&&ST[st]?st:CONFIG.defaultStation;
  return{view:'guest',station:st,zone,src:src==='qr'?'qr':'nfc'};
}

let chain=Promise.resolve();
const save=final=>(chain=chain.then(()=>saveReview(final)));   // записи по очереди: уточнение не обгоняет первую запись
async function saveReview(final){
  const doc={station:G.station,zone:G.zone,rating:G.r,chips:G.chips.slice(),comment:G.comment.trim().slice(0,600),lang:LANG,src:G.src,t:G.t,
    status:G.r<=2?'new':'ok',hasContact:!!(G.contact&&G.phone),by:UID||null,device:/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop'};
  let ok=false;
  if(DB){try{
    if(!G.stored){await DB.doc('reviews/'+G.rid).set(doc);G.stored=true}
    else await DB.doc('reviews/'+G.rid).update({chips:doc.chips,comment:doc.comment,hasContact:doc.hasContact});
    if(final&&doc.hasContact&&UID)await DB.doc('contacts/'+UID+'/items/'+G.rid).set({phone:G.phone.slice(0,30),consent:true,t:Date.now(),review:G.rid});
    ok=true}catch(e){ok=false}}
  if(!DB&&CONFIG.endpoint){try{await fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id:G.rid,...doc,chipsText:doc.chips.map(k=>chipName(G.zone,k,'ru')).join(', '),phone:final&&doc.hasContact?G.phone.slice(0,30):''})});ok=true}catch(e){}}
  G.saveOk=ok;return ok;
}

document.addEventListener('click',async e=>{

  else if(id==='noC'){G.contact=false;G.phone='';G.step='thanks';await save(true);renderGuest()}
  else if(id==='sendC'){G.step='thanks';await save(true);renderGuest()}
  else if(id==='again'){Object.assign(G,{step:'rate',r:0,chips:[],comment:'',contact:null,phone:'',consent:false,rid:null,stored:null,saveOk:null});renderGuest()}
});

     <div class="card kpi"><div class="l">${esc(t('avg'))}</div><div class="v" style="color:${col(avg)}">${avg?fmt1(avg):'—'}</div></div>
     <div class="card kpi"><div class="l">${esc(t('low'))}</div><div class="v">${low.length}</div></div>
     <div class="card kpi"><div class="l">${esc(t('open1'))}</div><div class="v" style="color:${open.length?'var(--bad)':'inherit'}">${open.length}</div></div></div>
    <div class="card"><h2 style="margin-bottom:8px">${esc(t('byZone'))}</h2>${byZ.map(x=>`<div class="zbar"><span>${ZIC[x.z]} ${esc(t('z.'+x.z))}</span><div class="track"><i style="width:${x.avg?(x.avg-1)/4*100:0}%;background:${col(x.avg)}"></i></div><span class="small" style="text-align:right">${x.avg?fmt1(x.avg)+' ★':'—'} · ${x.n}</span></div>`).join('')}</div>
    <div class="card"><div class="row" style="margin-bottom:6px"><h2>${esc(t('feed'))}</h2><span class="sp"></span><div class="seg" role="group">${['all',...ZONES].map(z=>`<button type="button" data-rz="${z}" aria-pressed="${RZ===z}">${z==='all'?esc(t('all')):ZIC[z]+' '+esc(t('z.'+z))}</button>`).join('')}</div></div>
     ${list.length?`<div class="list">${list.slice(0,100).map(r=>`<div class="rv"><div class="f">${face(r.rating)}</div><div style="min-width:0"><b>${esc(r.station)} · ${esc(t('z.'+r.zone))}</b> ${r.rating<=2?`<span class="pill ${r.status==='new'?'p-bad':'p-good'}">${esc(r.status==='new'?'1–2':t('done'))}</span>`:''}
       <div class="meta">${new Date(r.t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${ago(Date.now()-r.t)} ${esc(t('ago'))} · ${esc((t('src')||{})[r.src]||r.src)} · ${esc(r.lang||'')}</div>
       <div class="small">${(r.chips||[]).map(k=>esc(chipName(r.zone,k,LANG))).join(', ')||`<span class="muted">${esc(t('noReasons'))}</span>`}${r.comment?' · «'+esc(r.comment)+'»':''}</div>
       <div class="small" id="ph-${r.id}"></div></div>
       <div class="row" style="justify-content:flex-end">${r.hasContact&&ISADMIN?`<button type="button" class="mini" data-ph="${r.id}">📞 ${esc(t('showPhone'))}</button>`:''}${DB&&r.rating<=2&&r.status==='new'?`<button type="button" class="mini acc" data-done="${r.id}">${esc(t('markDone'))}</button>`:''}</div></div>`).join('')}</div>`:`<div class="empty">${esc(t('empty'))}</div>`}</div>`;
  app.innerHTML=`${nav('results')}<div><h1>${esc(t('resH'))}</h1><p class="muted" style="margin:6px 0 0">${esc(t(DB?'resSub':'resSubSheet'))}${!DB&&CONFIG.sheetUrl?` · <a href="${esc(CONFIG.sheetUrl)}" target="_blank" rel="noopener">${esc(t('openSheet'))}</a>`:''}</p></div>${content}`;
  app.querySelectorAll('[data-rz]').forEach(b=>b.addEventListener('click',()=>{RZ=b.dataset.rz;renderResults()}));
  app.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await DB.doc('reviews/'+b.dataset.done).update({status:'done',doneAt:Date.now()})}catch(e){b.disabled=false}}));
  app.querySelectorAll('[data-ph]').forEach(b=>b.addEventListener('click',async()=>{const r=REV.find(x=>x.id===b.dataset.ph),el=$('#ph-'+r.id);
    try{const s=await DB.doc('contacts/'+r.by+'/items/'+r.id).get();el.textContent=s.exists?'📞 '+s.data().phone:t('noPhone')}catch(e){el.textContent=t('noPhone')}}));
}
function subscribeResults(){
  if(unsub)return;
  if(!DB&&CONFIG.endpoint&&DB_READY){   // свой хостинг: читаем Google Таблицу, обновляем раз в 30 с
    const load=async()=>{try{const r=await fetch(CONFIG.endpoint+'?list=1',{cache:'no-store'});const j=await r.json();REV=Array.isArray(j.reviews)?j.reviews:[];resState='ok'}catch(e){if(resState==='loading')resState='nodb'}if(G.view==='results')renderResults()};
    load();const iv=setInterval(()=>{if(G.view==='results')load()},30000);unsub=()=>clearInterval(iv);return}
  if(!DB)return;
  const timer=setTimeout(()=>{if(resState==='loading'){resState='nodb';if(G.view==='results')renderResults()}},10000);
  unsub=DB.collection('reviews').orderBy('t','desc').limit(500).onSnapshot(snap=>{clearTimeout(timer);REV=snap.docs.map(d=>({id:d.id,...d.data()}));resState='ok';if(G.view==='results')renderResults()},
    ()=>{clearTimeout(timer);resState='nodb';if(G.view==='results')renderResults()});
}

// ===== Маршрут =====
function render(){
  const r=parseRoute();G.view=r.view;document.documentElement.lang=LANG;
  if(r.view==='guest'){if(G.station!==r.station||G.zone!==r.zone){Object.assign(G,{station:r.station,zone:r.zone,src:r.src,step:'rate',r:0,chips:[],comment:'',contact:null,phone:'',consent:false,rid:null,stored:null,saveOk:null})}renderGuest()}
  else if(r.view==='tags')renderTags();
  else if(r.view==='results'){if(!DB&&!CONFIG.endpoint&&resState==='loading'&&DB_READY)resState='nodb';subscribeResults();renderResults()}
  else{$('#app').className='wrap';$('#app').innerHTML=`<div class="card empty">${esc(t('nostation'))}</div>`}
}
window.addEventListener('hashchange',render);
let DB_READY=false;
render();
// возможности claude.ai: база отзывов и id пользователя (для отдельного хранения телефона)
(async()=>{
  if(window.claude&&typeof window.claude.use==='function'){
    try{DB=await window.claude.use('db')}catch(e){DB=null}
    try{USER=await window.claude.use('user');if(USER){UID=await USER.id();ISADMIN=await USER.canEdit()}}catch(e){}
  }
  DB_READY=true;
  if(G.view==='results'){if(!DB&&!CONFIG.endpoint)resState='nodb';else subscribeResults();renderResults()}
})();
</script>
</body></html>
